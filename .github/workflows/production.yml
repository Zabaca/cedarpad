name: Production

on:
  push:
    branches: [main]
    # Only redeploy when the app or its deploy wiring changed. web-poc's own
    # files, or the infra package (shared modules + the instance file) which can
    # affect how it deploys. zbc decrypts secrets.yaml itself via SOPS_AGE_KEY.
    paths:
      - 'packages/web-poc/**'
      - 'packages/infra/**'
      - '.github/workflows/production.yml'

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-web-poc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Apply production (web-poc)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bunx @zabaca/zbc apply production web-poc
