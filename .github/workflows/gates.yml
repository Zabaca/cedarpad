name: gates

# The unit tests, typechecks and lint that a release requires, run per commit,
# where the commit that breaks them is still on screen.
#
# ── Public repository: what a fork's pull request can and cannot reach ─────
# Everything here runs on GitHub's own runners, for a repository where they cost
# nothing. A pull request from a fork runs THIS file as the fork wrote it, so what
# keeps it harmless is what no version of the file can reach:
#   - no secret is used anywhere, and a fork's run is given none by GitHub;
#   - no job names a self-hosted runner (a fork could name any label the
#     repository has), and none is registered;
#   - the token is read-only for the whole workflow;
#   - there is no `pull_request_target` or `workflow_run` trigger, which would run
#     with the base repository's secrets and write token.
# packages/infra/workflows.test.ts fails the build if any of that changes.
# The repository setting "Require approval for all outside collaborators" holds EVERY
# run of a fork's pull request until a maintainer approves it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release preflight has to be able to ASK for these gates on main. Without
  # this it could only ever read a run some other event happened to create.
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # wrangler refuses to run under bun and resolves `node` off PATH; pinned
      # here for the same reason e2e.yml pins it rather than assuming it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NEVER `bun test` bare in packages/canvas: it collects web-poc's vitest
      # specs under the wrong runner and manufactures ~10 failures that are not
      # real. The package script scopes the directories. (CLAUDE.md says this;
      # it is repeated here because this file is where it would be got wrong.)
      # The server tests run against a REAL local D1 (miniflare), not a stub, so a
      # fresh runner needs the database created first. Local-only: miniflare's D1
      # is a file under `.wrangler/state`, so this needs no Cloudflare credentials
      # and touches nothing remote.
      - name: Create the local D1
        run: bun run webpoc:db:migrate:local
        working-directory: packages/canvas

      - name: canvas tests
        run: bun run test
        working-directory: packages/canvas

      - name: canvas typecheck
        run: bun run typecheck
        working-directory: packages/canvas

      - name: web-poc typecheck
        run: bun run webpoc:typecheck
        working-directory: packages/canvas

      - name: web-poc tests
        run: bun run webpoc:test
        working-directory: packages/canvas

  www:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This one is the changelog guard: it parses the committed CHANGELOG.md
      # and throws on a malformed entry. It is the only thing standing between a
      # format slip and content silently missing from the public page.
      - name: www tests
        run: bun run test
        working-directory: packages/www

      - name: www typecheck
        run: bun run typecheck
        working-directory: packages/www

      - name: www lint
        run: bun run lint
        working-directory: packages/www

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The zbc pin check, and the guard that keeps a fork's pull request away from
      # secrets and self-hosted runners (see the header).
      - name: infra tests
        run: bun run test
        working-directory: packages/infra

      - name: infra typecheck
        run: bun run typecheck
        working-directory: packages/infra
