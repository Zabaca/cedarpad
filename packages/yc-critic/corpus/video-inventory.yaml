# Tier 4 inventory: YC application-video sources (v2 prep, NO analysis).
# Purpose: catalog of known application videos + the official guidelines, so a
# future v2 pass can fetch/watch/transcribe and score them. Do not treat
# entries here as corpus records; no answer content was extracted.
source_group: tier4-video-inventory
fetch_date: 2026-07-12

official_guidelines:
  source_url: https://www.ycombinator.com/video
  page_title: "The Application Video | Y Combinator"
  summary: >
    YC's founder video exists so partners can evaluate how founders
    communicate, not to pitch the product. Guidelines: exactly ~1 minute;
    all co-founders appear (screen-record a video call if not co-located);
    only founders talking; speak conversationally from bullet points, never
    recite a written script; explicitly NOT the place for a demo or
    promotional video (the demo has its own separate application field).
    The page references example videos from companies such as Campus Job,
    Flip, Zenefits, and Teespring. Emphasis is authentic communication over
    production quality.
  maps_to_question_ids: [founder_video, demo_url]

