# Rejection + reapplication signal corpus
# Records from publicly-posted rejected YC applications and founder reapplication stories.
source_group: rejections-and-reapplications
fetch_date: 2026-07-12
notes: >
  Airbnb was NOT rejected by YC: the verified story (multiple sources, incl.
  Jeff Erickson LinkedIn and Medium retellings of the origin story) is that
  Airbnb was rejected by 7 VCs, nearly missed the YC W09 deadline, applied late
  after Justin Kan's cold email to Paul Graham, and was accepted; PG was
  skeptical of the idea but funded the founders (the cereal story sold
  determination). No rejected YC application exists to excerpt, so Airbnb has
  no record below; it belongs in an accepted-against-the-odds corpus instead.
  Failed sources are listed in the fetch log at the bottom.

records:
  # ---------------- Buffer, rejected S11 application (published in full) ----------------
  - company: Buffer
    batch: S11
    year: 2011
    stage_at_application: revenue
    outcome: rejected
    question_id: description_50_chars
    answer_excerpt: "Buffer is an application for Twitter which helps people Tweet consistently without spending all day on Twitter."
    answer_summary: >
      One-liner framed Buffer as a scheduling convenience tool for Twitter,
      a narrow single-platform utility rather than a category or wedge into
      something bigger.
    why_notable: >
      A real, working, revenue-generating product with a clear one-liner still
      rejected; signals that clarity alone doesn't clear the bar when the
      perceived ceiling is small ("a Twitter app" in 2011).
    source_url: https://buffer.com/resources/buffers-y-combinator-application/
    founder_commentary: >
      Joel Gascoigne published the full application in 2014, reflecting that
      "fit here just wasn't right" at the time and that accelerators look for
      world-changing ideas, star teams, or real traction; Buffer's traction was
      real but tiny.

  - company: Buffer
    batch: S11
    year: 2011
    stage_at_application: revenue
    outcome: rejected
    question_id: users_customers
    answer_excerpt: "1,500 users, 45 paying, $280/month revenue, ~4% free-to-paid conversion, ~400% monthly user growth."
    answer_summary: >
      Disclosed exact early metrics: 1,500 users, 45 paying customers, $280 MRR,
      4% conversion, fast percentage growth off a tiny base.
    why_notable: >
      The canonical "honest small numbers" rejection datapoint: precise,
      un-inflated metrics with strong relative growth were not enough; absolute
      scale read as too small. Useful calibration for what "revenue" means to
      reviewers vs. founders.
    source_url: https://buffer.com/resources/buffers-y-combinator-application/
    founder_commentary: >
      Joel's retrospective take: "accelerator programs and funding were not
      going to make our product great; our success was tied to our effort and
      ideas." Buffer joined AngelPad in Aug 2011 and later passed $20M ARR.

  - company: Buffer
    batch: S11
    year: 2011
    stage_at_application: revenue
    outcome: rejected
    question_id: competitors_insight
    answer_excerpt: "Named TweetDeck, Hootsuite, SocialOomph, Timely, Pluggio, and 14blocks as competitors."
    answer_summary: >
      Listed a crowded field of Twitter-tool competitors honestly; the
      published application's insight clause (what Buffer understood that they
      didn't) leaned on the consistency/scheduling-UX angle rather than a
      structural secret.
    why_notable: >
      Pattern: honest competitor lists in a crowded utility space without a
      strong "what we know that they don't" reads as a feature, not a company.
    source_url: https://buffer.com/resources/buffers-y-combinator-application/
    founder_commentary: null

  - company: Buffer
    batch: S11
    year: 2011
    stage_at_application: revenue
    outcome: rejected
    question_id: why_this_idea
    answer_excerpt: "Joel 'wanted to solve my own problem and was frustrated with how other tools approached scheduling tweets.'"
    answer_summary: >
      Founder-problem origin story: Joel built it for himself; cofounder Leo
      brought prior Twitter-education startup experience from Austria.
    why_notable: >
      Solve-your-own-problem plus relevant domain background is textbook YC
      advice, and this application had both; reinforces that the rejection was
      about perceived ambition/ceiling, not founder-market fit.
    source_url: https://buffer.com/resources/buffers-y-combinator-application/
    founder_commentary: null

  # ---------------- CodeAnt AI: rejected then accepted W24 via follow-up ----------------
  - company: CodeAnt AI
    batch: W24
    year: 2023
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: unmapped
    answer_excerpt: "'Our YC partners didn't grasp what we were building because we didn't explain our product and metrics clearly.'"
    answer_summary: >
      Rejected after the initial W24 interview (Oct 23, 2023). Instead of
      waiting a batch, the founders emailed back, got a second interview with a
      different partner a week later, and "focused solely on discussing the
      product and metrics; we were prepared" (they built a demo video and a
      clean metrics story). Accepted into W24.
      Legacy context: this is an interview-stage delta, not a written-form
      question; closest form analog is demo_url + users_customers clarity.
    why_notable: >
      Rare explicit "why rejected" from the rejection email itself: partner
      comprehension failure, fixed by a demo + metrics-first narrative. Also
      documents that a same-batch second interview via reply email is possible.
    source_url: https://www.linkedin.com/posts/amartya-jha_story-how-we-turned-yc-rejection-into-acceptance-activity-7168928421727625216-toaV
    founder_commentary: >
      Amartya Jha's post frames the whole delta as communication, not product:
      the product barely changed in a week; the explanation did.

  # ---------------- Fluently: accepted W24 on the third application ----------------
  - company: Fluently
    batch: W24
    year: 2023
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: previous_application
    answer_excerpt: "'Tom accepted us 80% because of our team, not the idea.'"
    answer_summary: >
      Founder (Yurii Rebryk) was accepted on the third application. The public
      HN thread and guide do not disclose the rejected applications' content;
      the stated decisive factor on the winning attempt was the team, and the
      guide (built after reviewing 100+ applications) pushes concrete traction
      and clarity as the repeat-application fixes.
    why_notable: >
      Third-try acceptance where the founder attributes the accept to team
      strength over idea; supports the pattern that reapplication deltas are
      scored on team/traction change, not prose polish. Delta specifics are
      NOT public: treat as directional, not excerptable.
    source_url: https://news.ycombinator.com/item?id=41987512
    founder_commentary: >
      Fluently published a full YC application guide
      (https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883,
      JS-gated, not fetchable here) distilled from reviewing 100+ applications.

  # ---------------- Basedash: 4 applications, accepted S20 ----------------
  - company: Basedash
    batch: S20
    year: 2020
    stage_at_application: pre_launch
    outcome: reapplied_then_accepted
    question_id: previous_application
    answer_excerpt: "Answered the previous-application question simply: 'N/A' (Basedash itself was a new idea vs. prior attempts)."
    answer_summary: >
      Max Musing applied 4 times across batches with multiple ideas, interviewed
      twice (Scholarly, then Basedash), and was accepted S20 with Basedash. The
      accepted application is published in full; the reapplication delta was a
      different, better idea rather than an iterated pitch of the same one.
    why_notable: >
      Counter-case to the "iterate the same idea" delta: the winning move was
      switching ideas. His distilled advice: "Improving your company is a
      better use of your time than improving your YC application." Also notes
      of his own published answers: "You'll notice that my application doesn't
      follow all of my own advice."
    source_url: https://www.basedash.com/blog/how-to-write-a-successful-yc-application
    founder_commentary: >
      Musing does not publish explicit why-rejected analysis for the failed
      attempts; the blog reproduces the full successful S20 application.

  # ---------------- Giveit100 (Karen X. Cheng): rejected at interview, 2013 ----------------
  - company: "100 (giveit100.com)"
    batch: W14
    year: 2013
    stage_at_application: launched_no_revenue
    outcome: rejected
    question_id: unmapped
    answer_excerpt: "'Challenge accepted.' (founder's public response; YC's rejection offered no actionable detail)"
    answer_summary: >
      Recently-launched consumer product rejected after a Nov 17, 2013 YC
      interview; the rejection email gave no specific reasons. Karen Cheng
      posted the rejection publicly; Joel Gascoigne (Buffer) and Drew Houston
      (Dropbox) commented with their own YC rejection stories.
      Legacy context: interview-stage rejection, no application answers shown,
      hence unmapped.
    why_notable: >
      Documents the common case: rejections usually arrive without stated
      reasons, so founders' "why rejected" analyses are self-diagnoses. Also a
      primary source that Dropbox's Houston publicly noted an earlier YC
      rejection of his own.
    source_url: https://medium.com/@karenxcheng/our-startup-got-rejected-by-y-combinator-135561d84ac6
    founder_commentary: >
      Cheng framed it as motivation ("Fall 7 times, get up 8") rather than
      offering a structural why-rejected analysis.

