  # ---------------- Spreadsheet Magic (Vlad Grichina), rejected S14, self-published in full ----------------
  - company: Spreadsheet Magic
    batch: S14
    year: 2014
    stage_at_application: pre_launch
    outcome: rejected
    question_id: description_50_chars
    answer_excerpt: "Programming system that uses direct manipulation and visualisation of data."
    answer_summary: >
      One-liner described the mechanism (direct manipulation, visualization)
      rather than the user or the outcome; over the 50-char guideline and
      abstract for a non-technical reader.
    why_notable: >
      Solo technical founder posted the full failed application to HN asking
      for feedback the day rejections went out. The one-liner is a clean
      example of mechanism-first framing that never names who it is for.
    source_url: http://spreadsheets-on-steroids.tumblr.com/post/82903500034/my-failed-application-to-yc-summer-2014
    founder_commentary: >
      Posted on HN (comment 7598958) as "my failed application to YC Summer
      2014... Would like to hear some feedback on my application."

  - company: Spreadsheet Magic
    batch: S14
    year: 2014
    stage_at_application: pre_launch
    outcome: rejected
    question_id: competitors_insight
    answer_excerpt: "Google Spreadsheets. Zapier. Unix pipes. Traditional programming languages... My biggest fear is Stoic doing good general purpose programming."
    answer_summary: >
      Named category-spanning substitutes (spreadsheets, Zapier, Unix pipes,
      programming languages) but no articulated insight competitors lack;
      volunteered fear of a tiny competitor instead.
    why_notable: >
      Anti-pattern datapoint: listing substitutes without the "what we
      understand that they don't" clause, plus unprompted fear of a rival.
    source_url: http://spreadsheets-on-steroids.tumblr.com/post/82903500034/my-failed-application-to-yc-summer-2014
    founder_commentary: null

  - company: Spreadsheet Magic
    batch: S14
    year: 2014
    stage_at_application: pre_launch
    outcome: rejected
    question_id: hacked_system
    answer_excerpt: "Started earning for living by competing in software development/design contests at TopCoder... Finally bought apartment using mostly money earned by competing there."
    answer_summary: >
      Strong resourcefulness answer (living off TopCoder winnings, bought an
      apartment); impressive-achievement answer was also solid (grew a custom
      dev firm from 5 to 15 people in under 2 years). Rejected anyway.
    why_notable: >
      Shows strong founder-signal answers do not rescue a pre-launch,
      solo-founder application whose idea section reads as a personal tool
      ("I'm building this because I need such tool to use myself") with a
      thin ceiling (~$50/month SaaS).
    source_url: http://spreadsheets-on-steroids.tumblr.com/post/82903500034/my-failed-application-to-yc-summer-2014
    founder_commentary: null

  # ---------------- Prusth (Siddharth Goutam Das), rejected W17, self-published in full ----------------
  - company: Prusth
    batch: W17
    year: 2016
    stage_at_application: idea_only
    outcome: rejected
    question_id: description_50_chars
    answer_excerpt: "Dynamic, smart and piracy-proof ebooks"
    answer_summary: >
      Adjective-stack one-liner for a proprietary ebook format (.berg) +
      creator tool + reader/marketplace, an idea-stage three-product platform
      taking on Amazon and Apple.
    why_notable: >
      Idea-stage solo application scoping a platform war (format + tooling +
      marketplace) with no traction; the one-liner is adjectives, not a claim.
    source_url: https://medium.com/@seadhart/my-rejected-yc-w17-application-ad85aa8851e5
    founder_commentary: >
      Founder self-published the full application on Medium titled "My
      Rejected YC W17 Application"; no rejection email text included.

  - company: Prusth
    batch: W17
    year: 2016
    stage_at_application: idea_only
    outcome: rejected
    question_id: why_this_idea
    answer_excerpt: "'I want to read a lot of books but I cannot by any means afford all of them and neither can billions of people' (cited his own 83 pirated ebooks as evidence)."
    answer_summary: >
      Personal-problem framing grounded in his own ebook piracy; demand
      evidence was self plus anecdote about friends preferring paper books.
    why_notable: >
      "Solve your own problem" done without any external validation; the
      evidence offered (own piracy habit) also cuts against the willingness-
      to-pay assumption the business needs.
    source_url: https://medium.com/@seadhart/my-rejected-yc-w17-application-ad85aa8851e5
    founder_commentary: null

  - company: Prusth
    batch: W17
    year: 2016
    stage_at_application: idea_only
    outcome: rejected
    question_id: how_make_money
    answer_excerpt: "We will make money through ads and sale of books... We would take maybe 20% of the total earnings of the publisher / writer."
    answer_summary: >
      Ad-supported free reading plus a ~20% take of publisher earnings;
      competitors answer named Amazon, Apple iBooks, and Google as threats.
    why_notable: >
      Hedge words ("maybe 20%") in the monetization answer of an idea-stage
      application against Amazon; a clean example of an unpriced, untested
      revenue model.
    source_url: https://medium.com/@seadhart/my-rejected-yc-w17-application-ad85aa8851e5
    founder_commentary: null

  # ---------------- Outsight AI, rejected F24, self-published in full ----------------
  - company: Outsight AI
    batch: F24
    year: 2024
    stage_at_application: revenue
    outcome: rejected
    question_id: description_50_chars
    answer_excerpt: "AI Agents to migrate legacy code & fix tech debt."
    answer_summary: >
      Crisp 49-char one-liner naming actor (AI agents), action (migrate),
      and object (legacy code / tech debt).
    why_notable: >
      A textbook-clean one-liner in a hot 2024 category still rejected;
      calibrates that one-liner quality alone is not the gate.
    source_url: https://medium.com/@rohanbalkondekar/our-yc-f24-application-6798b41a2fde
    founder_commentary: >
      Founder published the full application on Medium ending "We did not
      get in, we will come back stronger."

  - company: Outsight AI
    batch: F24
    year: 2024
    stage_at_application: revenue
    outcome: rejected
    question_id: users_customers
    answer_excerpt: "Signed two LOIs worth $100K ACV... binding contract of $2000 with Relance Medical Solutions... Half a dozen developers and two enterprises already using our open source repo"
    answer_summary: >
      Traction stated as LOIs plus one $2,000 binding contract plus small
      open-source usage; the headline number ($100K ACV) is letters of
      intent, not revenue.
    why_notable: >
      LOI-forward traction framing (big non-binding number before the small
      real one) in a crowded AI-codegen field; competitors answer dismissed
      Devin/Copilot/Codium as overlooking legacy complexity without evidence.
    source_url: https://medium.com/@rohanbalkondekar/our-yc-f24-application-6798b41a2fde
    founder_commentary: null

  - company: Outsight AI
    batch: F24
    year: 2024
    stage_at_application: revenue
    outcome: rejected
    question_id: how_make_money
    answer_excerpt: "Partnerships with major consultancies for distribution; Pricing: Quarter of Project Cost (Without AI); Path to $100M+: 1000 Customers paying $100k per year"
    answer_summary: >
      Revenue ceiling asserted as arithmetic (1000 x $100k) with
      consultancy-partnership distribution, at a stage with one $2k contract.
    why_notable: >
      The "1000 customers x $100k" template answer: ceiling math with no
      mechanism connecting current traction to it.
    source_url: https://medium.com/@rohanbalkondekar/our-yc-f24-application-6798b41a2fde
    founder_commentary: null

  # ---------------- Checkly, rejected W20 after interview (reasons summarized by founder) ----------------
  - company: Checkly
    batch: W20
    year: 2019
    stage_at_application: revenue
    outcome: rejected
    question_id: competitors_insight
    answer_excerpt: "'Unclear differentiator from Datadog except price: not sure if I fully agree.' (founder's summary of YC's stated reason)"
    answer_summary: >
      Solo founder Tim Nolet interviewed in Paris (Nov 2019) via Startup
      School and was rejected; he published the two stated reasons: unclear
      differentiation from Datadog beyond price, and no cofounder.
    why_notable: >
      One of the few founder-published cases with concrete YC-stated reasons
      (differentiation + solo founder). Checkly later raised a Series A+,
      making it a calibration point for YC false negatives.
      Note: reasons are founder-paraphrased, not application answer text.
    source_url: https://www.checklyhq.com/blog/just-did-the-ycombinator-interview-here-are-my-notes/
    founder_commentary: >
      "Just got the dreaded rejection email! Bit disappointed, but not
      bitter or disillusioned at all."

rejection_feedback:
  - company: Kudu (Slack alternative)
    year: 2022
    feedback_excerpt: "it's incredibly hard to get users to pay attention to a new tool. We've no doubt it will happen eventually but we suspect it will require a product that creates a completely new paradigm and no one saw coming."
    source_url: https://liorn.substack.com/p/rejected-from-ycombinator
  - company: Dashibase
    year: 2022
    feedback_excerpt: "'we had not gotten enough traction, and we didn't have a clear differentiation in a crowded space.' (from a screenshot of the rejection email; partial transcription)"
    source_url: https://dashibase.com/blog/our-short-yc-experience/
  - company: Relate (5 rejections before S22 acceptance)
    year: 2021
    feedback_excerpt: "Michael Seibel at the S21 interview: 'Why aren't you making money? It looks like you're a B2C SaaS. Have you tried B2B? ... How will you grow much faster than now?' (interview questions, not an email)"
    source_url: https://www.relate.so/blog/six-applications-y-combinator/
  - company: Replit
    year: 2017
    feedback_excerpt: "A YC partner in early office hours: an online REPL 'is not really a startup -- it's just a fun toy.' (narrative retelling; Replit was rejected 3x without interview before W18 acceptance)"
    source_url: https://replit.com/blog/yc

