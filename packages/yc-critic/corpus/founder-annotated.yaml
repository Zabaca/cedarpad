  # ---------------- Fluently (W24) guide ----------------
  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: description_50_chars
    answer_excerpt: "Good examples he cites: Loom, 'Record and share video messages instantly'; bad: 'Tynker for B2B creative thinking mLearning'."
    answer_summary: Name the customer and problem in plain words within 50 chars; only use "Airbnb for X" analogies when X is universally known.
    why_notable: Reviewer-side view (100+ applications reviewed) of why most one-liners fail on jargon and obscure references.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Avoid jargon and vague terminology; the reference-company analogy only works if the reference is universally known.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: what_will_you_make
    answer_excerpt: "He holds up Dropbox's original application answer (automatic sync, existing-workflow integration, offline access) as the model."
    answer_summary: Expand the one-liner in under 5 sentences, clarify customer/problem/solution, add one sentence of long-term vision; build a website in 1-2 days (e.g. Framer) and include a 60-90s demo video if an MVP exists.
    why_notable: Concrete length and demo-format guidance from a recent accepted founder.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Keep it under 5 sentences; the demo video should be 60-90 seconds of product, not pitch.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: how_far_along
    answer_excerpt: "Good example he gives: 'Founding team of 4 assembled. 70% of MVP complete. 10 onboarding calls scheduled in 2 weeks.'"
    answer_summary: 3-5 factual bullets leading with revenue, users, or LOIs; distinguish installs from active users; don't pad minimal progress with research fluff (his bad example lists '832 studies reviewed').
    why_notable: Explicitly names the metric-inflation patterns reviewers penalize.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Base everything on facts and numbers; misleading metrics (installs as users, uncontextualized retention) read as dishonesty.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: users_customers
    answer_excerpt: "His rewrite example: '4 couples using product. App free, but generated $150 in donations.'"
    answer_summary: Give concrete numbers per metric (payments, usage, LOIs, interviews) in 1-2 sentences; the same tiny traction stated plainly beats it buried in hedging.
    why_notable: Shows tiny traction is fine if stated as clean numbers rather than narrative.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Keep responses to 1-2 sentences of concrete numbers.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: why_this_idea
    answer_excerpt: "Model answer he cites: GitLab's founder needed the product at his previous job, and everyone at the company except account managers was a developer."
    answer_summary: One sentence on inspiration, 1-2 sentences on domain expertise, then facts/numbers showing market demand.
    why_notable: Gives an exact sentence budget for the founder-market-fit answer.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Lead with the personal inspiration, then evidence; keep it tight.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: competitors_insight
    answer_excerpt: "Model he cites: GitLab positioning open-source against GitHub Enterprise and Atlassian Stash, with open-source as free marketing."
    answer_summary: List 2-3 primary competitors, state how users solve the problem today, and articulate the differentiation and why it wins.
    why_notable: Reviewer-calibrated structure for the question most applicants dodge with "no competitors".
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Show the rationale for your advantage, not just a feature list.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: how_make_money
    answer_excerpt: "At $25/month subscription, need 334k paid customers ($100M ARR), representing 0.4% of 84 million non-native professionals."
    answer_summary: Bottom-up TAM only (customers x annual price), show the path to $100M ARR and what tiny market share that requires; never cite top-down analyst spend figures (his bad example is 'global $10B corporate training spend').
    why_notable: The excerpt appears to be Fluently's own market math, a worked template for the revenue-ceiling clause.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Bottom-up, not top-down; show the percentage of the market needed to reach $100M ARR.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: equity_breakdown
    answer_excerpt: null
    answer_summary: Roughly equal splits among essential founders; 50/50 for two cofounders; heavily skewed splits (90/10) flag future motivation problems.
    why_notable: Confirms the skewed-split screening flag from the reviewer side.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Every founder on the cap table should be critical to the company's success.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: other_ideas
    answer_excerpt: null
    answer_summary: Include 2-3 backup ideas, each as a 50-char description plus one sentence of rationale.
    why_notable: Gives a concrete format for a question most applicants leave vague or blank.
    source_url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    founder_commentary: Demonstrates thoughtfulness and flexibility.

  - company: Fluently
    batch: W24
    year: 2024
    stage_at_application: launched_no_revenue
    outcome: reapplied_then_accepted
    question_id: unmapped
    answer_excerpt: "\"Tom accepted us 80% because of our team, not the idea.\""
    answer_summary: >
      Cross-cutting principles plus HN-thread commentary: answer directly and concisely
      (1-5 sentences), facts and numbers over marketing language, honesty over optics,
      YC invests in people so lead with team excellence. In the HN thread Rebryk says
      their YC partner accepted them mostly on team; commenters add getting 4-5 YC
      alumni to review the application and doing practice interviews. Rebryk also notes
      he attended a rural Pennsylvania state school, countering the pedigree objection.
    why_notable: The team-over-idea admission is a direct data point on what actually drove an acceptance.
    source_url: https://news.ycombinator.com/item?id=41987512
    founder_commentary: "Legacy/meta note: whole-application principles and HN thread remarks, not a single form question."
