# Founder-annotated YC application guides (highest-value corpus group)
# Two sources where the founder published/annotated their own application advice per question.
source_group: founder-annotated
fetch_date: 2026-07-12
sources:
  - name: Basedash S20 annotated application
    url: https://www.basedash.com/blog/how-to-write-a-successful-yc-application
    note: >
      Full real application published with per-question founder commentary.
      Founder (Max Musing) applied 4 times total (2 interviews with different
      ideas) before Basedash was accepted into S20. Solo founder, prior YC
      experience (cofounded Scholarly/ScholarMe, S19).
  - name: Fluently (Yurii Rebryk, W24) YC application guide
    url: https://getfluently.notion.site/Y-Combinator-Application-Guide-1286a9ce04d98004b4dac50cf66fb883
    hn_thread: https://news.ycombinator.com/item?id=41987512
    note: >
      Guide by Yurii Rebryk (Fluently, YC W24; ex Google/Nvidia/Amazon), accepted
      on 3rd application, wrote the guide after reviewing 100+ applications.
      Guide is advice + good/bad example answers per question rather than a full
      published application; excerpts below are the examples he cites (some from
      famous YC apps like Dropbox/GitLab, one apparently Fluently's own TAM math).
      Direct Notion fetch was JS-gated; content retrieved via r.jina.ai render.

records:
  # ---------------- Basedash (S20) ----------------
  - company: Basedash
    batch: S20
    year: 2020
    stage_at_application: revenue
    outcome: reapplied_then_accepted
    question_id: description_50_chars
    answer_excerpt: "Collaborative database interface for teams."
    answer_summary: Ultra-concise positioning that fits the 50-char limit and names the product category plus who it is for.
    why_notable: The one-liner is what frames every subsequent answer for the reviewer.
    source_url: https://www.basedash.com/blog/how-to-write-a-successful-yc-application
    founder_commentary: This sentence forms the basis for how reviewers understand everything else; test it on people unfamiliar with the product to make sure it lands.

  - company: Basedash
    batch: S20
    year: 2020
    stage_at_application: revenue
    outcome: reapplied_then_accepted
    question_id: what_will_you_make
    answer_excerpt: "Basedash is a collaborative database interface that lets team members view and edit data directly from their production database."
    answer_summary: Positions the product as "Airtable for your existing database", letting teams access and edit production data without building internal tools.
    why_notable: Uses the "X but Y" well-known-comparison pattern to make a technical product instantly legible.
    source_url: https://www.basedash.com/blog/how-to-write-a-successful-yc-application
    founder_commentary: Calls this the most important question in the application; use comparisons to well-known products, and make sure a reviewer with no context understands the value proposition.

