# Canonical current YC application question set (reconstructed)
batch_reflected: "Fall 2026 as best reconstructed (question set stable across S25-S26 sources)"
verified_against_live_form: false
sources:
  - https://shizune.co/yc-application-examples
  - https://www.basedash.com/blog/how-to-write-a-successful-yc-application
  - https://capwave.ai/blog/blog-how-to-apply-to-y-combinator
  - https://www.peakdigitalstudio.com/articles/yc-application-questions-template
  - https://www.ycombinator.com/howtoapply
caveat: >
  The live form at apply.ycombinator.com is login-gated. This set is triangulated
  from 2025-2026 third-party guides and a published successful application, not
  from the live form. Exact wording, ordering, char limits, and any new
  batch-specific questions need one verification pass by a logged-in human
  before this is treated as canonical.

questions:
  # ---- COMPANY ----
  - question_id: company_name
    question_text: "Company name"
    section: company
    char_limit: null
    weight: low
    notes: "Basic field."
  - question_id: company_url
    question_text: "Company url, if any"
    section: company
    char_limit: null
    weight: low
    notes: "Basic field."
  - question_id: demo_url
    question_text: "If you have a demo, what's the url? (This is separate from the founder video.) A demo can be a video (~1 min screen recording with voiceover) or a link to a live product."
    section: company
    char_limit: null
    weight: high
    notes: "Capwave 2026 guide stresses: product demo, not a pitch video; ~60s screen recording preferred."
  - question_id: description_50_chars
    question_text: "Describe what your company does in 50 characters or less."
    section: company
    char_limit: 50
    weight: critical
    notes: "The one hard char limit. Multiple guides call the one-liner the most important sentence in the application."
  - question_id: what_will_you_make
    question_text: "What is your company going to make? Please describe your product and what it does or will do."
    section: company
    char_limit: null
    weight: critical
    notes: "Expands the one-liner: concrete product mechanics and who uses it."
  - question_id: location
    question_text: "Where do you live now, and where would the company be based after YC?"
    section: company
    char_limit: null
    weight: low
    notes: ""

  # ---- FOUNDERS ----
  - question_id: founder_video
    question_text: "Please enter the url of a 1 minute unlisted (not private) YouTube video introducing the founder(s)."
    section: founders
    char_limit: null
    weight: high
    notes: "Founder intro video, distinct from the demo. Unlisted, not private; ~1 minute."
  - question_id: technical_work
    question_text: "Who writes code, or does other technical work on your product? Was any of it done by a non-founder?"
    section: founders
    char_limit: null
    weight: high
    notes: "YC screens hard for in-house technical capability."
  - question_id: how_founders_met
    question_text: "How long have the founders known one another and how did you meet? Have any of the founders not met in person?"
    section: founders
    char_limit: null
    weight: medium
    notes: "Cofounder-relationship risk screen."
  - question_id: project_together
    question_text: "Please tell us about an interesting project, preferably outside of class or work, that two or more of you created together."
    section: founders
    char_limit: null
    weight: medium
    notes: "Evidence the team builds together; solo founders skip."
  - question_id: impressive_achievement
    question_text: "Please tell us in one or two sentences about something impressive that each founder has built or achieved."
    section: founders
    char_limit: null
    weight: critical
    notes: "Described by multiple guides as the most important question on the application. Soft limit: 1-2 sentences per founder."
  - question_id: hacked_system
    question_text: "Please tell us about the time you most successfully hacked some (non-computer) system to your advantage."
    section: founders
    char_limit: null
    weight: medium
    notes: "Signature YC question; looks for resourcefulness/edge."
  - question_id: exclusive_commitment
    question_text: "If accepted to YC, will you commit to working exclusively on this project for the next year?"
    section: founders
    char_limit: null
    weight: high
    notes: "Yes/No; effectively required to be yes. From Basedash's real application."

  # ---- PROGRESS ----
  - question_id: how_far_along
    question_text: "How far along are you?"
    section: progress
    char_limit: null
    weight: critical
    notes: "Traction headline: launched? users? revenue? Concrete numbers win."
  - question_id: how_long_working
    question_text: "How long have each of you been working on this? How much of that has been full-time?"
    section: progress
    char_limit: null
    weight: high
    notes: "Velocity signal: progress relative to time invested."
  - question_id: prototype_timeline
    question_text: "When will you have a prototype or beta?"
    section: progress
    char_limit: null
    weight: medium
    notes: "Only shown/relevant if pre-product."
  - question_id: users_customers
    question_text: "How many active users or customers do you have? How many are paying? Who is paying you the most, and how much do they pay you?"
    section: progress
    char_limit: null
    weight: critical
    notes: "Core traction question; specifics over adjectives."
  - question_id: revenue_monthly
    question_text: "We're interested in your revenue over the last several months. (Not cumulative and not GMV.)"
    section: progress
    char_limit: null
    weight: high
    notes: "Structured month-by-month USD fields in the live form (per Basedash)."
  - question_id: revenue_growth_notes
    question_text: "Anything else you would like us to know regarding your revenue or growth rate?"
    section: progress
    char_limit: null
    weight: medium
    notes: ""
  - question_id: previous_application
    question_text: "If you are applying with the same idea as a previous batch, did anything change? If you applied with a different idea, why did you pivot and what did you learn from the last idea?"
    section: progress
    char_limit: null
    weight: medium
    notes: "Re-applicant question; growth since last application is the strongest re-apply signal."
  - question_id: other_incubators
    question_text: "If you have already participated or committed to participate in an incubator, 'accelerator' or 'pre-accelerator' program, please tell us about it."
    section: progress
    char_limit: null
    weight: low
    notes: ""

  # ---- IDEA ----
  - question_id: why_this_idea
    question_text: "Why did you pick this idea to work on? Do you have domain expertise in this area? How do you know people need what you're making?"
    section: idea
    char_limit: null
    weight: critical
    notes: "Founder-market fit + evidence of demand; personal experience beats market-size talk."
  - question_id: whats_new
    question_text: "What's new about what you're making? What substitutes do people resort to because it doesn't exist yet (or they don't know about it)?"
    section: idea
    char_limit: null
    weight: critical
    notes: "Insight/novelty question; the substitutes clause is the tell for real understanding."
  - question_id: competitors_insight
    question_text: "Who are your competitors? What do you understand about your business that they don't?"
    section: idea
    char_limit: null
    weight: critical
    notes: "'Nobody' is a red flag; the second clause (secret/insight) is what gets scored."
  - question_id: how_make_money
    question_text: "How do or will you make money? How much could you make?"
    section: idea
    char_limit: null
    weight: high
    notes: "Business model + honest ceiling estimate."
  - question_id: how_get_users
    question_text: "How do users find your product? How did you get the users you have now? If you run paid ads, what is your cost of acquisition?"
    section: idea
    char_limit: null
    weight: high
    notes: "Distribution question; CAC sub-question added in recent batches."
  - question_id: company_category
    question_text: "Which category best applies to your company?"
    section: idea
    char_limit: null
    weight: low
    notes: "Dropdown selection (e.g. B2B SaaS, consumer, fintech, healthcare)."

  # ---- EQUITY ----
  - question_id: legal_entity
    question_text: "Have you formed ANY legal entity yet?"
    section: equity
    char_limit: null
    weight: low
    notes: "Yes/No, gates the entity-list question."
  - question_id: entity_list
    question_text: "Please list all legal entities you have and in what state or country each was formed (e.g. Delaware C Corp, Mexican SAPI, Singapore Pvt Ltd, etc.)."
    section: equity
    char_limit: null
    weight: low
    notes: "Conditional on legal_entity = yes."
  - question_id: equity_breakdown
    question_text: "Please describe the breakdown of the equity ownership in percentages among the founders, employees and any other stockholders. If there are multiple founders, be sure to give the equity ownership of each founder and founder title (e.g. CEO)."
    section: equity
    char_limit: null
    weight: medium
    notes: "Badly skewed founder splits are a known screening flag."
  - question_id: investment_taken
    question_text: "Have you taken any investment yet?"
    section: equity
    char_limit: null
    weight: medium
    notes: "Yes/No, gates fundraising detail fields."
  - question_id: monthly_spend
    question_text: "How much money do you spend per month?"
    section: equity
    char_limit: null
    weight: low
    notes: ""
  - question_id: bank_balance
    question_text: "How much money does your company have in the bank now?"
    section: equity
    char_limit: null
    weight: low
    notes: ""
  - question_id: runway
    question_text: "How long is your runway?"
    section: equity
    char_limit: null
    weight: low
    notes: ""

  # ---- CURIOUS ----
  - question_id: why_apply_yc
    question_text: "What convinced you to apply to Y Combinator? Did someone encourage you to apply? Have you been to any YC events?"
    section: curious
    char_limit: null
    weight: low
    notes: ""
  - question_id: how_heard
    question_text: "How did you hear about Y Combinator?"
    section: curious
    char_limit: null
    weight: low
    notes: ""

  # ---- OTHER ----
  - question_id: other_ideas
    question_text: "If you had any other ideas you considered applying with, please list them. One may be something we've been waiting for. Often when we fund people it's to do something they list here and not in the main application."
    section: other
    char_limit: null
    weight: medium
    notes: "YC explicitly says funded companies sometimes come from this answer."
  - question_id: surprising_discovery
    question_text: "Please tell us something surprising or amusing that one of you has discovered."
    section: other
    char_limit: null
    weight: medium
    notes: "Curiosity/insight probe; generic trivia scores poorly."
  - question_id: anything_else
    question_text: "Is there anything else we should know about your company?"
    section: other
    char_limit: null
    weight: low
    notes: "Catch-all; use for anomalies that need context (visas, prior startup, unusual structure)."
