[package]
name = "cedarpad"
version = "0.1.0"
description = "cedarpad desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cedarpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# WebDriver plugin — embedded in debug builds only so e2e tests can drive
# the WKWebView. Pulled in unconditionally because cargo features are global,
# but only `init`'d behind `cfg(debug_assertions)` in lib.rs. Release builds
# still link it; that's fine, it's dormant unless plugged in.
tauri-plugin-webdriver = "0.2"
# OS keychain access for the BYOK Anthropic API key (slice 3). The keyring
# crate is a thin cross-platform layer over the OS credential stores
# (macOS Keychain, Linux Secret Service / kwallet, Windows Credential
# Manager). Picked over tauri-plugin-stronghold (deprecated for v3) and
# the various third-party Tauri keyring plugins (low maintenance, no
# value-add over calling keyring directly).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
